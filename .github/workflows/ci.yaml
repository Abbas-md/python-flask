name: test pipeline
on: workflow_dispatch
jobs:
  my-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          
      - name: install python and cache 
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: python code
        run: |
          ls 
          pwd
          echo "${{ secrets.PEM }}" > key.pem
          chmod 400 key.pem
          scp -o StrictHostKeyChecking=no -i key.pem app.py ec2-user@65.1.108.106:/home/ec2-user
          scp -o StrictHostKeyChecking=no -i key.pem requirements.txt ec2-user@65.1.108.106:/home/ec2-user
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@65.1.108.106 "cd /home/ec2-user && python3 -m venv venv && source venv/bin/activate && pip3 install -r requirements.txt && nohup python app.py > app.log 2>&1 < /dev/null & exit"
          
          
          
